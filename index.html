<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerilla Transformation Hacks</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --vice-pink: #ff71ce;
            --vice-blue: #01ffff;
            --highlight-yellow: #fff200;
            --card-bg: #ffffff;
            --dot-color: #d1d5db;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px 15px; /* Reduziert für Mobile */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px; /* Kompakter */
            width: 100%;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1.8rem, 6vw, 3.5rem); /* Kleiner auf Mobile */
            margin: 0;
            color: var(--text-main);
            text-shadow: 2px 2px 0px var(--vice-pink), 4px 4px 0px var(--vice-blue);
            transform: rotate(-1deg);
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* HAUPT-CONTROLS */
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        button.main-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--vice-pink);
            font-size: 0.8rem;
            flex: 1;
            max-width: 180px;
        }

        /* FILTER */
        .filter-wrapper {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 25px;
        }

        #toggle-filter-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            padding: 5px;
        }

        .filter-nav {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            border: 2px solid #ddd;
            margin-top: 10px;
        }

        .filter-tag {
            background: #ffffff;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.65rem;
        }

        /* CARD DISPLAY */
        #display-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .single-mode { display: flex !important; justify-content: center; }

        .card-container {
            width: 100%;
            max-width: 320px;
            height: 480px; /* Kompakter für Mobile */
            perspective: 1200px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* FLICKER FIX: Verhindert Cyan-Aufblitzen */
        .card-container.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Wichtig für flüssigen Flip */
            -webkit-backface-visibility: hidden;
            background: var(--card-bg);
            border: 3px solid #1a1a1a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
        }

        .card-front img {
            width: 100%;
            height: 180px; /* Verkleinert für besseren Fit */
            object-fit: cover;
            border-bottom: 3px solid #1a1a1a;
        }

        .card-front .content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .highlight-title {
            display: inline;
            background: var(--highlight-yellow);
            padding: 2px 6px;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 2px solid #1a1a1a;
            box-shadow: 2px 2px 0px var(--vice-pink);
        }

        .teaser-text {
            font-size: 0.85rem;
            line-height: 1.3;
            margin-top: 10px;
        }

        .card-back {
            transform: rotateY(180deg);
            padding: 20px;
            background: #fff;
            border-top: 8px solid var(--vice-blue);
        }

        /* TEILEN ICON FIX */
        .share-link {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1rem;
            opacity: 0.3;
            z-index: 10;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            background: var(--text-main);
            color: white;
            padding: 10px 20px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px var(--vice-blue);
            transform: translateY(100px);
            transition: 0.3s;
            z-index: 10000;
        }
        #toast.show { transform: translateY(0); }

        @media (max-width: 600px) {
            body { padding: 10px 10px; }
            h1 { margin-top: 5px; }
            .card-container { height: 440px; }
            .subtitle { letter-spacing: 1px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Guerilla Transformation Hacks</h1>
        <div class="subtitle">Miami Change Division</div>
    </header>

    <div class="controls">
        <button class="main-btn" onclick="showRandom()">Zufalls-Hack</button>
        <button class="main-btn" style="background:#fff; color:#000; border:2px solid #000; box-shadow: 3px 3px 0px var(--vice-blue);" onclick="showAll()">Alle Hacks</button>
    </div>

    <div class="filter-wrapper">
        <button id="toggle-filter-btn" onclick="toggleFilterNav()">+ Themen filtern</button>
        <div class="filter-nav" id="filter-nav"></div>
    </div>

    <div id="display-container"></div>
    <div id="toast">Link kopiert!</div>

    <script src="data.js"></script>
    <script>
        const container = document.getElementById('display-container');
        const filterNav = document.getElementById('filter-nav');
        const toast = document.getElementById('toast');
        const toggleBtn = document.getElementById('toggle-filter-btn');
        let currentFilter = 'All';

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleFilterNav() {
            const isVisible = filterNav.style.display === 'flex';
            filterNav.style.display = isVisible ? 'none' : 'flex';
            toggleBtn.innerText = isVisible ? '+ Themen filtern' : '- Filter schließen';
        }

        function copyLink(e, url) {
            e.stopPropagation();
            const fullUrl = window.location.origin + window.location.pathname + url;
            navigator.clipboard.writeText(fullUrl).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function initFilters() {
            const allTags = new Set(['All']);
            cardData.forEach(card => card.tags.forEach(tag => allTags.add(tag)));
            filterNav.innerHTML = '';
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `filter-tag ${tag === 'All' ? 'active' : ''}`;
                btn.innerHTML = `${tag}`;
                btn.onclick = () => filterCards(tag, btn);
                filterNav.appendChild(btn);
            });
        }

        function createCardHTML(data) {
            const tagsHTML = data.tags.map(t => `<span class="tag-pill" style="font-size:0.6rem; background:var(--vice-blue); color:#000; padding:2px 5px; margin-right:3px; font-weight:800; text-transform:uppercase;">${t}</span>`).join('');
            return `
                <div class="card-container" id="card-${data.id}" onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <img src="${data.image}" alt="">
                            <div class="content">
                                <div><span class="highlight-title">${data.title}</span></div>
                                <p class="teaser-text">${data.teaser}</p>
                                <div style="display:flex; gap:3px; flex-wrap:wrap; margin-top:auto;">${tagsHTML}</div>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <div class="share-link" onclick="copyLink(event, '?id=${data.id}')">🔗</div>
                            <h3 style="font-weight:900; text-transform:uppercase; color:var(--vice-pink); margin:0 0 10px 0; font-size:1.1rem;">${data.title}</h3>
                            <span style="font-size:0.6rem; font-weight:900; text-transform:uppercase; color:#999; display:block;">Beschreibung</span>
                            <p style="font-size:0.8rem; line-height:1.4; margin:3px 0 10px 0;">${data.text}</p>
                            <span style="font-size:0.6rem; font-weight:900; text-transform:uppercase; color:#999; display:block;">Hintergrund</span>
                            <p style="font-size:0.8rem; line-height:1.4; margin:3px 0 10px 0;">${data.hintergrund || '---'}</p>
                            <div style="margin-top:auto; font-size:0.6rem; color:#999; border-top:1px solid #eee; padding-top:5px;">${data.source || 'Guerilla Archives'}</div>
                        </div>
                    </div>
                </div>`;
        }

        function filterCards(tag, btn) {
            currentFilter = tag;
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            container.classList.remove('single-mode');
            let filtered = tag === 'All' ? [...cardData] : cardData.filter(c => c.tags.includes(tag));
            shuffleArray(filtered);
            container.innerHTML = filtered.map(c => createCardHTML(c)).join('');
        }

        function showRandom() {
            const filtered = currentFilter === 'All' ? cardData : cardData.filter(c => c.tags.includes(currentFilter));
            const card = filtered[Math.floor(Math.random() * filtered.length)];
            container.classList.add('single-mode');
            container.innerHTML = createCardHTML(card);
        }

        function showAll() {
            filterCards('All', null);
        }

        initFilters();
    </script>
</body>
</html>
