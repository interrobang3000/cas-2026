<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerilla Transformation Hacks</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-olive: #556b2f;
            --highlight-yellow: #fff200;
            --dot-color: #e5e5e5;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header { text-align: center; margin-bottom: 40px; width: 100%; }
        h1 { font-size: clamp(1.8rem, 8vw, 2.8rem); font-weight: 800; margin: 0; letter-spacing: -0.02em; }
        .subtitle { color: var(--text-muted); margin-top: 10px; font-size: 1.1rem; padding: 0 10px; }

        /* FILTER */
        .filter-nav {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 8px; margin-bottom: 30px; max-width: 800px;
        }

        .filter-tag {
            background: white; border: 1px solid #ddd; padding: 8px 16px;
            border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.2s;
        }

        .filter-tag.active {
            background: var(--accent-olive); color: white; border-color: var(--accent-olive);
        }

        /* BUTTONS */
        .controls { margin-bottom: 40px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        
        button.main-btn {
            background: var(--text-main); color: white; border: none;
            padding: 14px 24px; border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: transform 0.1s; width: 100%; max-width: 280px;
        }
        button.main-btn:active { transform: scale(0.98); }

        /* CARDS GRID */
        #display-container {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px; width: 100%; max-width: 1100px;
        }

        .single-mode { display: flex !important; justify-content: center; }

        /* CARD ANIMATION & DESIGN */
        .card-container { 
            width: 100%; max-width: 320px; height: 460px; 
            perspective: 1000px; cursor: pointer;
            opacity: 0; transform: translateY(20px);
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); transform-style: preserve-3d; }
        .card-container.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            background: white; border-radius: 12px; border: 1px solid #eee;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--card-shadow);
        }

        .card-front img { width: 100%; height: 220px; object-fit: cover; }
        .card-front .content { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        .highlight-title {
            display: inline;
            background-image: linear-gradient(100deg, rgba(255, 242, 0, 0.8) 0%, rgba(255, 242, 0, 0.9) 100%);
            background-repeat: no-repeat; background-size: 100% 0.8em; background-position: 0 0.4em;
            padding: 0 4px; font-size: 1.4rem; font-weight: 800; line-height: 1.4;
        }

        .card-back { transform: rotateY(180deg); padding: 30px; border-top: 6px solid var(--accent-olive); }
        .card-back b { background: var(--highlight-yellow); display: inline-block; padding: 2px 8px; margin-bottom: 15px; }

        .tag-pill {
            font-size: 0.7rem; background: #f0f0f0; padding: 4px 10px;
            border-radius: 4px; color: var(--text-muted); text-transform: uppercase; font-weight: 600;
        }

        .source { font-size: 0.75rem; color: #999; margin-top: auto; padding-top: 15px; border-top: 1px solid #eee; }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 600px) {
            body { padding: 40px 15px; }
            h1 { line-height: 1.2; }
            .card-container { height: 420px; } /* Etwas flacher auf Mobile */
            .controls { flex-direction: column; align-items: center; }
            button.main-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Guerilla Transformation Hacks</h1>
        <div class="subtitle">Veränderung mit kleinen Interventionen.</div>
    </header>

    <div class="filter-nav" id="filter-nav"></div>

    <div class="controls">
        <button class="main-btn" onclick="showRandom()">Zufalls-Hack ziehen</button>
        <button class="main-btn" style="background:#eee; color:#111; border:1px solid #ddd" onclick="showAll()">Alle Hacks anzeigen</button>
    </div>

    <div id="display-container"></div>

    <script src="data.js"></script>
    <script>
        const container = document.getElementById('display-container');
        const filterNav = document.getElementById('filter-nav');
        let currentFilter = 'All';

        function initFilters() {
            const allTags = new Set(['All']);
            cardData.forEach(card => card.tags.forEach(tag => allTags.add(tag)));
            filterNav.innerHTML = '';
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `filter-tag ${tag === 'All' ? 'active' : ''}`;
                btn.innerText = tag;
                btn.onclick = () => filterCards(tag, btn);
                filterNav.appendChild(btn);
            });
        }

        function createCardHTML(data, index) {
            const cleanText = data.text.replace(/Tactics/g, 'Hacks').replace(/Taktik/g, 'Hack');
            const cleanFullTitle = data.fullTitle.replace(/Tactics/g, 'Hacks').replace(/Taktik/g, 'Hack');
            const cleanTitle = data.title.replace(/Tactics/g, 'Hacks').replace(/Taktik/g, 'Hack');
            const tagsHTML = data.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
            
            // Verzögerung für Kaskaden-Effekt beim Laden vieler Karten
            const delay = index ? `style="animation-delay: ${index * 0.05}s"` : '';

            return `
                <div class="card-container" ${delay} onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <img src="${data.image}" alt="">
                            <div class="content">
                                <div><span class="highlight-title">${cleanTitle}</span></div>
                                <div style="display:flex; gap:5px; margin-top:15px; flex-wrap:wrap;">${tagsHTML}</div>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <b>${cleanFullTitle}</b>
                            <p>${cleanText}</p>
                            <div class="source">ID: ${data.source}</div>
                        </div>
                    </div>
                </div>`;
        }

        function filterCards(tag, btn) {
            currentFilter = tag;
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            container.classList.remove('single-mode');
            const filtered = tag === 'All' ? cardData : cardData.filter(c => c.tags.includes(tag));
            container.innerHTML = filtered.map((c, i) => createCardHTML(c, i)).join('');
        }

        function showRandom() {
            const filtered = currentFilter === 'All' ? cardData : cardData.filter(c => c.tags.includes(currentFilter));
            const card = filtered[Math.floor(Math.random() * filtered.length)];
            container.classList.add('single-mode');
            container.innerHTML = createCardHTML(card, 0);
            window.scrollTo({ top: container.offsetTop - 100, behavior: 'smooth' });
        }

        function showAll() { 
            const activeBtn = document.querySelector('.filter-tag.active');
            filterCards(currentFilter, activeBtn); 
        }

        initFilters();
    </script>
</body>
</html>
