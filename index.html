<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerilla Transformation Hacks</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-olive: #556b2f;
            --highlight-yellow: #fff200;
            --dot-color: #e5e5e5;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header { text-align: center; margin-bottom: 40px; width: 100%; }
        h1 { font-size: clamp(1.8rem, 8vw, 2.8rem); font-weight: 800; margin: 0; letter-spacing: -0.02em; }
        .subtitle { color: var(--text-muted); margin-top: 10px; font-size: 1.1rem; }

        .filter-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 30px; max-width: 800px; }
        .filter-tag { background: white; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .filter-tag.active { background: var(--accent-olive); color: white; border-color: var(--accent-olive); }
        .tag-link-icon { margin-left: 8px; opacity: 0.4; }

        .controls { margin-bottom: 40px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        button.main-btn { background: var(--text-main); color: white; border: none; padding: 14px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; max-width: 280px; }

        #display-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; width: 100%; max-width: 1200px; }
        .single-mode { display: flex !important; justify-content: center; }

        /* KARTEN-STYLING */
        .card-container { width: 100%; max-width: 340px; height: 520px; perspective: 1000px; cursor: pointer; opacity: 0; transform: translateY(20px); animation: slideUp 0.5s ease forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); transform-style: preserve-3d; }
        .card-container.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: white; border-radius: 12px; border: 1px solid #eee; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--card-shadow); }
        
        /* VORDERSEITE */
        .card-front img { width: 100%; height: 200px; object-fit: cover; }
        .card-front .content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }
        .highlight-title { display: inline; background-image: linear-gradient(100deg, rgba(255, 242, 0, 0.8) 0%, rgba(255, 242, 0, 0.9) 100%); background-repeat: no-repeat; background-size: 100% 0.8em; background-position: 0 0.4em; padding: 0 4px; font-size: 1.3rem; font-weight: 800; }
        .teaser-text { font-size: 0.9rem; color: #444; line-height: 1.4; margin: 0; }

        /* RÜCKSEITE */
        .card-back { transform: rotateY(180deg); padding: 25px; border-top: 8px solid var(--accent-olive); display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .card-back h3 { margin: 0; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; }
        .section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--accent-olive); margin-bottom: 4px; display: block; }
        .card-back p { font-size: 0.85rem; line-height: 1.5; margin: 0; color: #333; }
        
        .share-link { position: absolute; top: 20px; right: 20px; cursor: pointer; opacity: 0.3; }
        .tag-pill { font-size: 0.65rem; background: #f0f0f0; padding: 3px 8px; border-radius: 4px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .source-box { margin-top: auto; padding-top: 10px; border-top: 1px solid #eee; font-size: 0.7rem; color: #999; }

        #toast { position: fixed; bottom: 20px; background: #111; color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; transform: translateY(100px); transition: 0.3s; z-index: 1000; }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <header>
        <h1>Guerilla Transformation Hacks</h1>
        <div class="subtitle">Veränderung mit kleinen Interventionen.</div>
    </header>

    <div class="filter-nav" id="filter-nav"></div>

    <div class="controls">
        <button class="main-btn" onclick="showRandom()">Zufalls-Hack ziehen</button>
        <button class="main-btn" style="background:#eee; color:#111; border:1px solid #ddd" onclick="showAll()">Alle Hacks anzeigen</button>
    </div>

    <div id="display-container"></div>
    <div id="toast">Link kopiert!</div>

    <script src="data.js"></script>
    <script>
        const container = document.getElementById('display-container');
        const filterNav = document.getElementById('filter-nav');
        const toast = document.getElementById('toast');
        let currentFilter = 'All';

        function copyLink(e, url) {
            e.stopPropagation();
            const fullUrl = window.location.origin + window.location.pathname + url;
            navigator.clipboard.writeText(fullUrl).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function initFilters() {
            const allTags = new Set(['All']);
            cardData.forEach(card => card.tags.forEach(tag => allTags.add(tag)));
            filterNav.innerHTML = '';
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `filter-tag ${tag === 'All' ? 'active' : ''}`;
                btn.innerHTML = `${tag} <span class="tag-link-icon" onclick="copyLink(event, '?tag=${tag}')">🔗</span>`;
                btn.onclick = (e) => { if(e.target === btn) filterCards(tag, btn); };
                filterNav.appendChild(btn);
            });
        }

        function createCardHTML(data, index) {
            const tagsHTML = data.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
            const delay = index ? `style="animation-delay: ${index * 0.05}s"` : '';
            
            return `
                <div class="card-container" ${delay} id="card-${data.id}" onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <img src="${data.image}" alt="">
                            <div class="content">
                                <div><span class="highlight-title">${data.title}</span></div>
                                <p class="teaser-text">${data.teaser}</p>
                                <div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:auto;">${tagsHTML}</div>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <div class="share-link" onclick="copyLink(event, '?id=${data.id}')">🔗</div>
                            <h3>${data.title}</h3>
                            
                            <div>
                                <span class="section-label">Beschreibung</span>
                                <p>${data.text}</p>
                            </div>
                            
                            <div>
                                <span class="section-label">Hintergrund</span>
                                <p>${data.hintergrund}</p>
                            </div>

                            <div class="source-box">
                                <span class="section-label">Quelle</span>
                                ${data.source}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function filterCards(tag, btn) {
            currentFilter = tag;
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            container.classList.remove('single-mode');
            const filtered = tag === 'All' ? cardData : cardData.filter(c => c.tags.includes(tag));
            container.innerHTML = filtered.map((c, i) => createCardHTML(c, i)).join('');
        }

        function showRandom() {
            const filtered = currentFilter === 'All' ? cardData : cardData.filter(c => c.tags.includes(currentFilter));
            const card = filtered[Math.floor(Math.random() * filtered.length)];
            container.classList.add('single-mode');
            container.innerHTML = createCardHTML(card, 0);
        }

        function showAll() { filterCards('All', document.querySelector('.filter-tag')); }

        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const tag = params.get('tag');
            if (id) {
                const card = cardData.find(c => c.id == id);
                if (card) {
                    container.classList.add('single-mode');
                    container.innerHTML = createCardHTML(card, 0);
                    setTimeout(() => document.getElementById(`card-${id}`).classList.add('is-flipped'), 600);
                }
            } else if (tag) {
                const btn = Array.from(document.querySelectorAll('.filter-tag')).find(b => b.innerText.includes(tag));
                filterCards(tag, btn);
            }
        }

        initFilters();
        checkUrlParams();
    </script>
</body>
</html>
