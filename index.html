<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerilla Transformation Tactics</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-olive: #556b2f; /* Modernes Urban Olive */
            --accent-light: #f0f4e8;
            --dot-color: #e5e5e5;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
            --card-shadow-hover: 0 15px 35px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 80px 24px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Zentriert den gesamten Inhalt horizontal */
            min-height: 100vh;
        }

        /* HEADER - Zentriert */
        header {
            max-width: 800px;
            width: 100%;
            margin-bottom: 60px;
            text-align: center; /* Titel & Untertitel zentriert */
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 16px 0;
            line-height: 1.1;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto; /* Zentriert den Block */
        }

        /* STEUERUNG - Zentriert */
        .controls {
            margin-bottom: 60px;
            display: flex;
            gap: 12px;
            justify-content: center; /* Zentriert die Buttons */
            width: 100%;
        }

        button {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
        }

        button:hover {
            background: var(--accent-olive);
            transform: translateY(-1px);
        }

        button#btn-all {
            background: white;
            color: var(--text-main);
            border: 1px solid #ddd;
        }

        button#btn-all:hover {
            border-color: var(--accent-olive);
            color: var(--accent-olive);
        }

        .hidden { display: none !important; }

        /* GRID / CONTAINER */
        #display-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            justify-content: center; /* Zentriert Karten im Grid */
        }

        /* Spezifische Zentrierung für die Zufallskarte */
        .single-mode {
            display: flex !important;
            justify-content: center;
            width: 100%;
        }

        /* KARTEN */
        .card-container {
            width: 320px;
            height: 460px;
            perspective: 2000px;
            cursor: pointer; /* Pointer für die gesamte Karte */
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: white;
            border-radius: 12px;
            border: 1px solid #eee;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-container:hover .card-face {
            box-shadow: var(--card-shadow-hover);
            border-color: var(--accent-olive);
        }

        /* VORDERSEITE */
        .card-front img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            filter: grayscale(0.2);
            transition: filter 0.3s ease;
        }

        .card-container:hover .card-front img {
            filter: grayscale(0); /* Bild wird beim Hover farbig */
        }

        .card-front .content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-front h2 {
            font-size: 1.35rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .card-front .tap-hint {
            font-size: 0.8rem;
            color: var(--accent-olive);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* RÜCKSEITE */
        .card-back {
            transform: rotateY(180deg);
            padding: 35px;
            border-top: 6px solid var(--accent-olive); /* Farblicher Akzent oben */
        }

        .card-back b {
            font-size: 1.25rem;
            display: block;
            margin-bottom: 20px;
            color: var(--accent-olive);
            line-height: 1.2;
        }

        .card-back p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #333;
            margin: 0;
        }

        .card-back .source {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding-top: 20px;
            border-top: 1px solid #eee;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Guerilla Transformation Tactics</h1>
        <div class="subtitle">Veränderung mit kleinen Interventionen. Ein Archiv systemischer Hebelpunkte.</div>
    </header>

    <div class="controls">
        <button id="btn-random" onclick="showRandom()">Taktik ziehen</button>
        <button id="btn-all" class="hidden" onclick="showAll()">Alle anzeigen</button>
    </div>

    <div id="display-container"></div>

    <script src="data.js"></script>

    <script>
        const container = document.getElementById('display-container');
        const btnAll = document.getElementById('btn-all');
        let lastIndex = -1;

        function createCardHTML(data) {
            return `
                <div class="card-container" onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <img src="${data.image}" alt="">
                            <div class="content">
                                <h2>${data.title}</h2>
                                <span class="tap-hint">Intervention analysieren →</span>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <b>${data.fullTitle}</b>
                            <p>${data.text}</p>
                            <div class="source">REF-ID: ${data.source}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showRandom() {
            if (typeof cardData === 'undefined') return;
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * cardData.length);
            } while (randomIndex === lastIndex && cardData.length > 1);
            
            lastIndex = randomIndex;
            container.classList.add('single-mode');
            container.innerHTML = createCardHTML(cardData[randomIndex]);
            btnAll.classList.remove('hidden');
            
            // Sanftes Einblenden bei neuem Zufall
            container.style.opacity = 0;
            setTimeout(() => { container.style.opacity = 1; container.style.transition = "opacity 0.4s"; }, 10);
        }

        function showAll() {
            container.classList.remove('single-mode');
            container.innerHTML = cardData.map(card => createCardHTML(card)).join('');
        }
    </script>
</body>
</html>
