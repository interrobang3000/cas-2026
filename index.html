<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerilla Transformation Hacks</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --vice-pink: #ff71ce;
            --vice-blue: #01ffff;
            --highlight-yellow: #fff200;
            --card-bg: #ffffff;
            --dot-color: #d1d5db;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin: 0;
            color: var(--text-main);
            text-shadow: 3px 3px 0px var(--vice-pink), 6px 6px 0px var(--vice-blue);
            transform: rotate(-1deg);
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 15px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* HAUPT-CONTROLS */
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button.main-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--vice-pink);
            transition: 0.2s;
        }

        button.main-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--vice-pink);
        }

        /* FILTER AUSKLAPP-MECHANISMUS */
        .filter-wrapper {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 50px;
        }

        #toggle-filter-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 10px;
            transition: color 0.2s;
        }

        #toggle-filter-btn:hover {
            color: var(--vice-pink);
        }

        .filter-nav {
            display: none; /* Initial versteckt */
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border: 2px dashed #d1d5db;
            margin-top: 10px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .filter-tag {
            background: #ffffff;
            border: 2px solid #ddd;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .filter-tag.active {
            background: var(--text-main);
            color: #fff;
            border-color: var(--text-main);
            box-shadow: 4px 4px 0px var(--vice-blue);
        }

        /* CARD GRID */
        #display-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .single-mode { display: flex !important; justify-content: center; }

        .card-container {
            width: 100%;
            max-width: 340px;
            height: 520px;
            perspective: 1200px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }

        .card-container.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border: 3px solid #1a1a1a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
        }

        .card-front img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 3px solid #1a1a1a;
        }

        .card-front .content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .highlight-title {
            display: inline;
            background: var(--highlight-yellow);
            padding: 2px 6px;
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 2px solid #1a1a1a;
            box-shadow: 3px 3px 0px var(--vice-pink);
        }

        .teaser-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text-main);
            margin-top: 10px;
        }

        .card-back {
            transform: rotateY(180deg);
            padding: 25px;
            background: #fff;
            border-top: 10px solid var(--vice-blue);
        }

        .card-back h3 {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            color: var(--vice-pink);
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 4px;
            display: block;
        }

        .tag-pill {
            font-size: 0.65rem;
            background: var(--vice-blue);
            color: #000;
            padding: 3px 8px;
            border-radius: 2px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .share-link {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            opacity: 0.4;
        }

        .source-box {
            margin-top: auto;
            font-size: 0.7rem;
            color: #999;
            border-top: 2px solid #eee;
            padding-top: 10px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            background: var(--text-main);
            color: white;
            padding: 12px 24px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 0;
            box-shadow: 4px 4px 0px var(--vice-blue);
            transform: translateY(150px);
            transition: 0.3s;
            z-index: 1000;
        }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <header>
        <h1>Guerilla Transformation Hacks</h1>
        <div class="subtitle">Miami Change Division</div>
    </header>

    <div class="controls">
        <button class="main-btn" onclick="showRandom()">Zufalls-Hack</button>
        <button class="main-btn" style="background:#fff; color:#000; border:2px solid #000; box-shadow: 4px 4px 0px var(--vice-blue);" onclick="showAll()">Alle anzeigen (Shuffle)</button>
    </div>

    <div class="filter-wrapper">
        <button id="toggle-filter-btn" onclick="toggleFilterNav()">+ Nach Themen filtern</button>
        <div class="filter-nav" id="filter-nav"></div>
    </div>

    <div id="display-container"></div>
    <div id="toast">Link kopiert!</div>

    <script src="data.js"></script>
    <script>
        const container = document.getElementById('display-container');
        const filterNav = document.getElementById('filter-nav');
        const toast = document.getElementById('toast');
        const toggleBtn = document.getElementById('toggle-filter-btn');
        let currentFilter = 'All';

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleFilterNav() {
            const isVisible = filterNav.style.display === 'flex';
            filterNav.style.display = isVisible ? 'none' : 'flex';
            toggleBtn.innerText = isVisible ? '+ Nach Themen filtern' : '- Filter schließen';
        }

        function copyLink(e, url) {
            e.stopPropagation();
            const fullUrl = window.location.origin + window.location.pathname + url;
            navigator.clipboard.writeText(fullUrl).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function initFilters() {
            const allTags = new Set(['All']);
            cardData.forEach(card => card.tags.forEach(tag => allTags.add(tag)));
            filterNav.innerHTML = '';
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `filter-tag ${tag === 'All' ? 'active' : ''}`;
                btn.innerHTML = `${tag} <span onclick="copyLink(event, '?tag=${tag}')" style="cursor:help;margin-left:5px">🔗</span>`;
                btn.onclick = (e) => { if(e.target.tagName !== 'SPAN') filterCards(tag, btn); };
                filterNav.appendChild(btn);
            });
        }

        function createCardHTML(data) {
            const tagsHTML = data.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
            return `
                <div class="card-container" id="card-${data.id}" onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <img src="${data.image}" alt="">
                            <div class="content">
                                <div><span class="highlight-title">${data.title}</span></div>
                                <p class="teaser-text">${data.teaser}</p>
                                <div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:auto;">${tagsHTML}</div>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <div class="share-link" onclick="copyLink(event, '?id=${data.id}')">🔗</div>
                            <h3>${data.title}</h3>
                            <span class="section-label">Beschreibung</span>
                            <p>${data.text}</p>
                            <span class="section-label">Hintergrund</span>
                            <p>${data.hintergrund || '---'}</p>
                            <div class="source-box">${data.source || 'Guerilla Archives'}</div>
                        </div>
                    </div>
                </div>`;
        }

        function filterCards(tag, btn) {
            currentFilter = tag;
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            container.classList.remove('single-mode');
            let filtered = tag === 'All' ? [...cardData] : cardData.filter(c => c.tags.includes(tag));
            shuffleArray(filtered);
            container.innerHTML = filtered.map(c => createCardHTML(c)).join('');
        }

        function showRandom() {
            const filtered = currentFilter === 'All' ? cardData : cardData.filter(c => c.tags.includes(currentFilter));
            const card = filtered[Math.floor(Math.random() * filtered.length)];
            container.classList.add('single-mode');
            container.innerHTML = createCardHTML(card);
        }

        function showAll() {
            const allBtn = Array.from(document.querySelectorAll('.filter-tag')).find(b => b.innerText.includes('All'));
            filterCards('All', allBtn);
        }

        initFilters();
    </script>
</body>
</html>
