<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerilla Transformation Action – Hacks aus der Toolbox</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --vice-pink: #ff71ce;
            --vice-blue: #01ffff;
            --highlight-yellow: #fff200;
            --card-bg: #ffffff;
            --dot-color: #d1d5db;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header { text-align: center; margin-bottom: 20px; width: 100%; }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1.8rem, 7vw, 3.5rem);
            margin: 0;
            text-shadow: 2px 2px 0px var(--vice-pink), 4px 4px 0px var(--vice-blue);
            transform: rotate(-1deg);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        button.main-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--vice-pink);
            font-size: 0.75rem;
            flex: 1;
        }

        .filter-wrapper { width: 100%; max-width: 800px; text-align: center; margin-bottom: 25px; }

        #toggle-filter-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase; cursor: pointer;
            padding: 10px;
        }

        .filter-nav {
            display: none; flex-wrap: wrap; justify-content: center; gap: 8px;
            padding: 15px; background: rgba(255, 255, 255, 0.7);
            border-radius: 4px; border: 2px solid #ddd; margin-top: 10px;
        }

        .filter-tag {
            background: #ffffff; border: 1px solid #ddd; padding: 6px 12px;
            border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 0.65rem;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }

        .filter-tag.active { background: var(--text-main); color: white; box-shadow: 2px 2px 0 var(--vice-blue); }

        .tag-share-icon { opacity: 0.5; font-size: 0.8rem; transition: 0.2s; }
        .tag-share-icon:hover { opacity: 1; color: var(--vice-pink); }

        #display-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            justify-items: center;
        }

        .single-mode { display: flex !important; justify-content: center; }

        .card-container {
            width: 320px;
            height: 480px;
            perspective: 1500px;
            cursor: pointer;
            -webkit-perspective: 1500px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--card-bg);
            border: 3px solid #1a1a1a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        .card-front img {
            width: 100%; height: 180px; object-fit: cover;
            border-bottom: 3px solid #1a1a1a;
        }

        .card-front .content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }

        .highlight-title {
            display: inline-block; background: var(--highlight-yellow);
            padding: 2px 6px; font-size: 1.1rem; font-weight: 900;
            text-transform: uppercase; border: 2px solid #1a1a1a;
            box-shadow: 2px 2px 0px var(--vice-pink);
        }

        .teaser-text { font-size: 0.85rem; line-height: 1.3; margin-top: 10px; }

        .card-back {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            padding: 20px;
            background: #fff;
            border-top: 8px solid var(--vice-blue);
            white-space: pre-line; /* Diese Zeile ist entscheidend für die Umbrüche */
        }

        .share-link { position: absolute; top: 10px; right: 10px; font-size: 1rem; opacity: 0.3; z-index: 10; }

        footer {
            margin-top: 50px;
            margin-bottom: 20px;
            font-size: 0.6rem;
            color: #bbbbbb;
            text-align: center;
            max-width: 90vw;
            line-height: 1.4;
        }

        #toast {
            position: fixed; bottom: 20px; background: var(--text-main); color: white;
            padding: 10px 20px; font-weight: 800; text-transform: uppercase;
            box-shadow: 3px 3px 0px var(--vice-blue); transform: translateY(100px);
            transition: 0.3s; z-index: 10000;
        }
        #toast.show { transform: translateY(0); }

        @media (max-width: 600px) {
            .card-container { width: 92vw; max-width: 320px; height: 460px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Guerilla Transformation Actions</h1>
        <div class="subtitle" id="toolbox-counter">Lade Hacks...</div>
    </header>

    <div class="controls">
        <button class="main-btn" onclick="showRandom()">Surprise me</button>
        <button class="main-btn" style="background:#fff; color:#000; border:2px solid #000; box-shadow: 3px 3px 0px var(--vice-blue);" onclick="showAll()">Show me all</button>
    </div>

    <div class="filter-wrapper">
        <button id="toggle-filter-btn" onclick="toggleFilterNav()">+ Themen filtern</button>
        <div class="filter-nav" id="filter-nav"></div>
    </div>

    <div id="display-container"></div>
    <div id="toast">Link kopiert!</div>

    <footer>
        | Ein Produkt aus dem CAS Transformation Toolbox | 2026 | Vivienne Driske, Florian Gehrig, Martin Lüscher, Cornelia Marti |
    </footer>

    <script>
        // 1. CACHE-BUSTER: Lädt data.js immer in der neuesten Version
        const script = document.createElement('script');
        script.src = 'data.js?v=' + Date.now();
        document.head.appendChild(script);

        script.onload = () => {
            const container = document.getElementById('display-container');
            const filterNav = document.getElementById('filter-nav');
            const toast = document.getElementById('toast');
            const toggleBtn = document.getElementById('toggle-filter-btn');
            const counterEl = document.getElementById('toolbox-counter');
            let currentFilter = 'All';

            // 2. SERVICE-WORKER CLEANUP
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function toggleFilterNav() {
                const isVisible = filterNav.style.display === 'flex';
                filterNav.style.display = isVisible ? 'none' : 'flex';
                toggleBtn.innerText = isVisible ? '+ Themen filtern' : '- Filter schließen';
            }

            function copyLink(e, url) {
                if(e) e.stopPropagation();
                const fullUrl = window.location.origin + window.location.pathname + url;
                navigator.clipboard.writeText(fullUrl).then(() => {
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                });
            }

            function initFilters() {
                const allTags = new Set(['All']);
                cardData.forEach(card => card.tags.forEach(tag => allTags.add(tag)));
                filterNav.innerHTML = '';
                allTags.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.className = `filter-tag ${tag === 'All' ? 'active' : ''}`;
                    btn.innerHTML = `<span>${tag}</span><span class="tag-share-icon" title="Kategorie teilen">🔗</span>`;
                    btn.onclick = (e) => {
                        if (e.target.classList.contains('tag-share-icon')) {
                            copyLink(e, `?tag=${tag}`);
                        } else {
                            filterCards(tag, btn);
                        }
                    };
                    filterNav.appendChild(btn);
                });
            }

            function createCardHTML(data) {
                // ÄNDERUNG: Hintergrund entfernt (transparent), Rahmenfarbe schwarz gesetzt
                const tagsHTML = data.tags.map(t => `<span class="tag-pill" style="font-size:0.55rem; background:transparent; color:#000; padding:2px 4px; margin-right:3px; font-weight:800; border:1px solid #000;">${t}</span>`).join('');
                return `
                    <div class="card-container" id="card-${data.id}" onclick="this.classList.toggle('is-flipped')">
                        <div class="card-inner">
                            <div class="card-face card-front">
                                <img src="${data.image}" alt="">
                                <div class="content">
                                    <div><span class="highlight-title">${data.title}</span></div>
                                    <p class="teaser-text">${data.teaser}</p>
                                    <div style="display:flex; gap:3px; flex-wrap:wrap; margin-top:auto;">${tagsHTML}</div>
                                </div>
                            </div>
                            <div class="card-face card-back">
                                <div class="share-link" onclick="copyLink(event, '?id=${data.id}')">🔗</div>
                                <h3 style="font-weight:900; text-transform:uppercase; color:var(--vice-pink); margin:0 0 10px 0; font-size:1.0rem;">${data.title}</h3>
                                
                                <span style="font-size:0.65rem; font-weight:900; text-transform:uppercase; color:#999; display:block;">Beschreibung</span>
                                <p style="font-size:0.9rem; line-height:1.4; margin:2px 0 12px 0;">${data.text}</p>
                                
                                <span style="font-size:0.65rem; font-weight:900; text-transform:uppercase; color:#999; display:block;">Hintergrund</span>
                                <p style="font-size:0.9rem; line-height:1.4; margin:2px 0 12px 0;">${data.hintergrund || '---'}</p>
                                
                                <div style="margin-top:auto; font-size:0.55rem; color:#bbbbbb; border-top:1px solid #eee; padding-top:4px;">
                                    <span style="font-weight:900; text-transform:uppercase;">Inspiration:</span> ${data.source || 'Guerilla Archives'}
                                </div>
                            </div>
                        </div>
                    </div>`;
            }

            function filterCards(tag, btn) {
                currentFilter = tag;
                document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
                if(btn) btn.classList.add('active');
                container.classList.remove('single-mode');
                let filtered = tag === 'All' ? [...cardData] : cardData.filter(c => c.tags.includes(tag));
                shuffleArray(filtered);
                container.innerHTML = filtered.map(c => createCardHTML(c)).join('');
            }

            function showRandom() {
                const filtered = currentFilter === 'All' ? cardData : cardData.filter(c => c.tags.includes(currentFilter));
                const card = filtered[Math.floor(Math.random() * filtered.length)];
                container.classList.add('single-mode');
                container.innerHTML = createCardHTML(card);
            }

            function showAll() {
                filterCards('All', Array.from(document.querySelectorAll('.filter-tag')).find(b => b.innerText.includes('All')));
            }

            initFilters();
            counterEl.innerText = `${cardData.length} Hacks aus der Toolbox`;

            const params = new URLSearchParams(window.location.search);
            if (params.get('id')) {
                const card = cardData.find(c => c.id == params.get('id'));
                if(card) {
                    container.classList.add('single-mode');
                    container.innerHTML = createCardHTML(card);
                }
            } else if (params.get('tag')) {
                filterCards(params.get('tag'), null);
            } else {
                showRandom();
            }

            window.showRandom = showRandom;
            window.showAll = showAll;
            window.toggleFilterNav = toggleFilterNav;
            window.copyLink = copyLink;
        };
    </script>
</body>
</html>
